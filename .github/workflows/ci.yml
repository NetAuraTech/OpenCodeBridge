name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Run dart format check
        working-directory: app
        run: dart format --set-exit-if-changed --output=none lib test

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install GTK build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build clang pkg-config libgtk-3-dev

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release
