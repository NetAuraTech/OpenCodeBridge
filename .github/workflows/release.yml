name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0-pre.1 (created and pushed if missing)'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

# Tag-driven release: Linux tarball + Android APK, published as a GitHub
# release (pre-release by default for -pre/-rc/-alpha tags). The AAB is built
# too but only kept as a run artifact (the `play-aab` artifact on the release
# run) — it is the Google Play upload format and is deliberately NOT attached
# to the public release, so the signed bundle cannot be republished on a
# competing Play account under the same package name. Bump the
# `version:` in app/pubspec.yaml, push, then tag `vX.Y.Z[-pre.N]` — or run the
# workflow manually with the tag input (it creates the tag).
#
# Android release signing needs these repo secrets (release keystore, see
# docs in the build-android job):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      name: ${{ steps.resolve.outputs.name }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve tag and pre-release flag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::No tag: provide the tag input on workflow dispatch."
            exit 1
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag '$TAG' must start with 'v'"; exit 1 ;;
          esac
          # A dispatch may name a tag that does not exist yet: create it on HEAD.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          NAME="${TAG#v}"
          # Fail fast: the tag's X.Y.Z must match app/pubspec.yaml's version.
          TAG_VERSION="${NAME%%-*}"
          PUBSPEC_VERSION="$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' app/pubspec.yaml | head -n 1)"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::tag $TAG (version $TAG_VERSION) does not match app/pubspec.yaml (version ${PUBSPEC_VERSION:-unreadable})."
            echo "::error::Bump the version: in app/pubspec.yaml, push, then tag (or fix the tag)."
            exit 1
          fi
          # Pre-release: explicit on dispatch, otherwise the semver pre-release
          # suffix on the tag (v0.1.0-pre.1 -> pre-release, v0.1.0 -> regular).
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$PRERELEASE_INPUT" ]; then
            PRERELEASE="$PRERELEASE_INPUT"
          else
            case "$NAME" in
              *-*) PRERELEASE=true ;;
              *) PRERELEASE=false ;;
            esac
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build-linux:
    runs-on: ubuntu-latest
    needs: [version]
    env:
      VERSION: ${{ needs.version.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Install GTK build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build clang pkg-config libgtk-3-dev

      - name: Enforce pubspec.lock
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release

      - name: Package tarball
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/opencodebridge_${VERSION}_linux_x64.tar.gz" -C app/build/linux/x64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: artifacts/

  build-android:
    runs-on: ubuntu-latest
    needs: [version]
    env:
      VERSION: ${{ needs.version.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      # Release signing (app/android/app/build.gradle.kts reads the KEYSTORE_*
      # env vars; without them the release build falls back to the debug key).
      # Create a keystore once:
      #   keytool -genkeypair -v -keystore release.keystore -alias <alias> \
      #     -keyalg RSA -keysize 2048 -validity 10000
      # then set the repo secrets:
      #   ANDROID_KEYSTORE_BASE64   base64 of the .keystore file
      #   ANDROID_KEYSTORE_PASSWORD keystore password
      #   ANDROID_KEY_ALIAS         key alias
      #   ANDROID_KEY_PASSWORD      key password
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret ANDROID_KEYSTORE_BASE64 is not set — the Android release build needs a release keystore (see the step above)."
            exit 1
          fi
          mkdir -p app/android/app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/keystore/release.keystore

      - name: Enforce pubspec.lock
        working-directory: app
        run: flutter pub get --enforce-lockfile

      # Absolute path: gradle resolves relative storeFile paths against the
      # :app module dir (app/android/app), not the repo root.
      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/android/app/keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app
        run: flutter build apk --release

      - name: Build AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/android/app/keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app
        run: flutter build appbundle --release

      - name: Stage artifacts
        run: |
          mkdir -p artifacts artifacts-play
          cp app/build/app/outputs/flutter-apk/app-release.apk "artifacts/opencodebridge_${VERSION}_android.apk"
          cp app/build/app/outputs/bundle/release/app-release.aab "artifacts-play/opencodebridge_${VERSION}_android.aab"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: artifacts/

      # The AAB is the Google Play upload format: kept as a run artifact for
      # the Play upload, never attached to the public release (see header).
      - name: Upload AAB artifact (Play upload only, not released)
        uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: artifacts-play/

  release:
    runs-on: ubuntu-latest
    needs: [version, build-linux, build-android]
    permissions:
      contents: write

    steps:
      # release-* only: the play-aab artifact (Google Play upload format) is
      # deliberately excluded from the published release assets.
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'release-*'
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
